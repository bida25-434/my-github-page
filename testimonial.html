<DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonial</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .testimonial-container {
            display: grid;
            grid-template-columns: 1fr; 
            gap: 20px;
            padding: 20px;
            margin-bottom: 60px;
            width: 200px;
        }
      .testimonial {
            border: 1px solid #ccc;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
      .h1 {
        text-align: center;
        font-size: 1.4em;
        font-weight: bold;
        color: brown;
      }
       @media (max-width: 600px) {
            .products-container {
                grid-template-columns: repeat(1, 1fr);
            }
        }
       @media (min-width: 600px) {
            .products-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (min-width: 100px) {
            .products-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Tell Us About Your Experience</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a> 
            <a href="contact.html">Contact</a>
            <a href="products.html">Products</a>
            <a href="testimonal.html">Testimonial</a>
        </nav>
    </header>
    <main class="container my-5">
        <div class="testimonial-container">
          <div class="testimonial" data-name="t1">
          <article>
            <p>The house is amazing, the color blends with the furniture and is very spacious</p>
            <div class="h1">
              Joy Manisa
            </div>
          </article>
          </div>
          <div class="testimonial" data-name="t2">  
          <article>
            <p>The material used is of good quality making the house durable</p>
            <div class="h1">
              Monty Marman
            </div>
          </article>
          </div>  
          </div>
        </div>
        <form action="acknowledgement.html" method="get">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>

            <div class="buttons">
                <button type="reset" class="clear-btn">Clear</button>
                <button type="submit" class="submit-btn">Submit</button>
            </div>
    </main>

    <footer>
        <p>&copy: 2026 Joy</p>
    </footer>
    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
